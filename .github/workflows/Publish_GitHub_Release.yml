# ✍️ Description:
# This workflow will be triggered automatically when a tag is pushed to the repo.
# It will create a new github release with the new app version and the release notes.
# 🚨 GTHUB SECRETS REQUIRED: None
name: New GitHub Release
on:
  push:
    # only release a new pip package if the commit it tagged ex.v1.0.3 or v1.2.0dev1
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+dev[0-9]+"
  workflow_dispatch:

jobs:
  build:
    name: New GitHub Release
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    defaults:
      run:
        # Set the default shell to the bash login shell. Use a login shell to ensure a complete environment initialization, aligning with local development setups and loading necessary profiles and paths.
        shell: bash -l {0}
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          # Full history: generateReleaseNotes diffs against the previous tag to build the
          # changelog, which a shallow clone cannot see.
          fetch-depth: 0
      # A bare vX.Y.Z is a real release; anything else the trigger accepts -- a1, b1, rc1,
      # dev1 -- is a test upload to TestPyPI and must not become the release users land on.
      - name: 🏷️ Classify the tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 🏃Create A Github Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          # Mark the newest version tag as "Latest" on the releases page. Left false, every
          # release stays unmarked and the page keeps pointing at whatever was last flagged.
          # Prereleases are excluded so an rc never displaces the last real release.
          makeLatest: ${{ steps.tag.outputs.prerelease == 'false' }}
