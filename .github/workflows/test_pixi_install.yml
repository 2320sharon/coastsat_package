name: Test pixi install

# Verifies that coastsat_package installs from source with pixi on every
# supported OS, then imports cleanly. Complements the conda-based test workflow.
on:
  push:
    branches: [add_gh_action]
  pull_request:
    branches: [add_gh_action]
  workflow_dispatch:

jobs:
  pixi-install:
    name: pixi install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi and install the default + test environments
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: >-
            default
            test
          locked: true   # fail if pixi.lock is out of sync with pyproject.toml
          cache: true

      - name: Import smoke test (default environment — pytest absent)
        run: pixi run smoke-test

      - name: Run credential-free unit tests (test environment)
        run: pixi run -e test test
