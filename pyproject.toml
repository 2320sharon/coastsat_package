[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# tells setup tools to include the data in the coastsat directory
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*"=["*.kml","*.pkl"]

[project]
name = "coastsat_package"
dynamic = ["readme"]
version = "0.4.7"
authors = [
  { name="Sharon Fitzpatrick" },
]
# find` directive with `include` or `exclude`
description = "A packaged version of CoastSat: A Global shoreline mapping tool from satellite imagery"
dependencies = [ "scikit-image",
  "earthengine-api>=0.1.304",
  "jupyterlab>=3.0.0",
  "geopandas",
  "matplotlib",
  "astropy",
  "tqdm",
  "importlib-resources",
  "pyqt5",
  "scipy",
  "numpy",
  "imageio",
  "scikit-learn",
  "shapely",       
  "pandas",         
  "joblib",         
  "pytz",           
  "requests",       
  "google-auth"]    
  # NOTE: gdal (osgeo) is also imported but intentionally NOT listed here — the GDAL
  # wheel needs system libraries and routinely fails to pip-install. It is supplied by
  # conda (see README) and by the conda-forge feedstock recipe.
license = { file="LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/SatelliteShorelines/coastsat_package"
"Bug Tracker" = "https://github.com/SatelliteShorelines/coastsat_package/issues"

# --- pixi configuration ---------------------------------------------------
# Makes this repo a pixi project so `pixi install` builds a working coastsat
# environment from source. The geospatial stack is pulled from conda-forge
# (reliable cross-platform binaries) while the project itself is installed as
# an editable PyPI path dependency. CI verifies this on Linux/macOS/Windows.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
coastsat-package = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
geopandas = "*"
gdal = "*"
scikit-image = "*"
scikit-learn = "*"
scipy = "*"
numpy = "*"
matplotlib = "*"
imageio = "*"
astropy = "*"
tqdm = "*"
pyqt = "*"            # conda name for the pyqt5 PyPI dependency
jupyterlab = ">=3.0.0"
earthengine-api = ">=0.1.304"

[tool.pixi.tasks]
smoke-test = "python -c \"import coastsat; print('coastsat OK:', coastsat.__file__)\""

# Run the pytest-based test suite with the command: pixi run -e test test

# Testing tooling lives in its own feature/environment so the default (shipping)
# environment stays pytest-free.
[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.test.tasks]
# Runs only the GEE-free unit tests under tests/ (the root-level test_*.py need EE auth)
test = "pytest tests/ -v"

[tool.pixi.environments]
# `default` ships without pytest; `test` = default + the test feature. The shared
# solve-group keeps both environments on identical versions of the common packages.
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

